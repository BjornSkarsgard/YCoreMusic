[package]
name = "ycore-music"
version = "0.0.3"
edition = "2021"
default-run = "YCoreMusic"
autobins = false

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"
pkg-config = "0.3"
serde_json = "1"

[dependencies]
getrandom = "0.4.3"
url = "2.5.8"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
keyring = { version = "3.6.3", features = ["windows-native", "apple-native", "sync-secret-service", "crypto-rust"] }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "form", "native-tls"] }
rpassword = { version = "7.5.4" }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154" }
souvlaki = { version = "0.9.3", default-features = false, features = ["use_zbus"] }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2.7.0"
tauri-plugin-power-monitor = "0.1.0"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2.14.1"
unicode-normalization = "0.1.26"
zeroize = { version = "1.9.1" }


[features]
default = ["single-player-host", "audio-analysis", "linux-player-host"]
yandex-probe = []
mirror-probe = ["tauri/unstable"]
single-player-host = []
linux-embed-referrer = ["dep:webkit2gtk"]
linux-player-host = ["linux-embed-referrer", "dep:gtk"]
audio-analysis = ["windows/Win32_Media_Audio", "windows/Win32_System_Com", "windows/Win32_System_Com_StructuredStorage", "windows/Win32_System_Variant", "windows/Win32_System_Threading", "windows/Win32_Security"]
audio-probe = ["audio-analysis", "windows/Win32_System_Diagnostics_ToolHelp"]

[[bin]]
name = "YCoreMusic"
path = "src/main.rs"

[[bin]]
name = "yandex-probe"
path = "src/bin/yandex-probe.rs"
required-features = ["yandex-probe"]

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = ["Win32_System_Power", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell"] }
windows-core = "0.62.2"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18.2", optional = true }
zbus = "5.19.0"
raw-window-handle = "0.6.2"
x11rb = { version = "0.14.0", default-features = false, features = ["randr"] }
webkit2gtk = { version = "=2.0.2", features = ["v2_40"], optional = true }

[patch.crates-io]
tauri-plugin-power-monitor = { path = "../../../vendor/tauri-plugin-power-monitor" }

[profile.native-test]
inherits = "dev"
