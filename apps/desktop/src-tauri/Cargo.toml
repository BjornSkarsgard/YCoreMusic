[package]
name = "encore"
version = "0.0.1"
edition = "2021"
default-run = "encore"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "native-tls"], optional = true }
rpassword = { version = "7.5.4", optional = true }
serde_json = { version = "1.0.154", optional = true }
tauri = { version = "2", features = [] }
zeroize = { version = "1.9.1", optional = true }


[features]
yandex-probe = ["dep:reqwest", "dep:serde_json", "dep:rpassword", "dep:zeroize"]

[[bin]]
name = "yandex-probe"
path = "src/bin/yandex-probe.rs"
required-features = ["yandex-probe"]
