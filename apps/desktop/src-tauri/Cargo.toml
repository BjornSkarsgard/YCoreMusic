[package]
name = "encore"
version = "0.0.1"
edition = "2021"
default-run = "encore"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
keyring = { version = "3.6.3", features = ["windows-native", "apple-native", "sync-secret-service", "crypto-rust"] }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "native-tls"] }
rpassword = { version = "7.5.4" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154" }
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
zeroize = { version = "1.9.1" }


[features]
yandex-probe = []

[[bin]]
name = "yandex-probe"
path = "src/bin/yandex-probe.rs"
required-features = ["yandex-probe"]
