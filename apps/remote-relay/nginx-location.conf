location ^~ /remote/ {
    access_log off;
    client_max_body_size 400k;
    limit_req zone=ycore_remote burst=40 nodelay;
    limit_conn ycore_remote_connections 36;
    proxy_pass http://127.0.0.1:5183;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-YCore-Peer $remote_addr;
    proxy_set_header Connection "";
    proxy_read_timeout 32s;
}
