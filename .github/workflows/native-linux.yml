name: Linux native smoke
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: linux-native-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native-x11:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          cache-on-failure: true
      - name: WebKitGTK and X11 test environment
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev libdbus-1-dev webkit2gtk-driver xvfb xauth openbox dbus-x11 fonts-dejavu x11-utils
      - run: npm ci --prefix apps/desktop
      - run: npm run build --prefix apps/desktop
      - run: cargo build --manifest-path apps/desktop/src-tauri/Cargo.toml --profile native-test --features tauri/custom-protocol --bin encore
      - run: cargo install tauri-driver --version 2.1.0 --locked
      - name: Native GTK window, isolated storage, history, mini and instance lifecycle
        env:
          GDK_BACKEND: x11
          LIBGL_ALWAYS_SOFTWARE: '1'
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
          ENCORE_NATIVE_DRIVER: /usr/bin/WebKitWebDriver
          ENCORE_AUTOSTART_SMOKE: '1'
        run: xvfb-run -a -s '-screen 0 1600x1000x24' dbus-run-session -- sh scripts/native-linux.sh
      - name: Window manager diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-native-window-diagnostics
          if-no-files-found: ignore
          path: |
            .tools/openbox.log
            .tools/native-linux-error.txt
