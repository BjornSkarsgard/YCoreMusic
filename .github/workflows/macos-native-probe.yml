name: macOS native probe
on:
  workflow_dispatch:
  push:
    branches: ['codex/macos-media-preview']
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - run: npm ci
        working-directory: apps/desktop
      - run: npx tauri build --debug --no-bundle --features macos-native-probe
        working-directory: apps/desktop
      - run: node scripts/native-macos-remote.mjs
        env:
          YCORE_MACOS_TEST_CLIP: '1'
          YCORE_MACOS_EXPECT_LOOPBACK: '1'
      - name: Package debug app for the manual media probe
        working-directory: apps/desktop
        run: |
          npx tauri bundle --debug --config src-tauri/tauri.bundle.conf.json --bundles app
          ditto -c -k --keepParent "src-tauri/target/debug/bundle/macos/YCore Music.app" "${RUNNER_TEMP}/ycore-mac-probe.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ycore-mac-probe-${{ matrix.os }}
          path: ${{ runner.temp }}/ycore-mac-probe.zip
          retention-days: 14
