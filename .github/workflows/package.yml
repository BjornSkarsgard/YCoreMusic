name: Installation packages
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Build platform (artifacts only; no publication)
        type: choice
        required: true
        default: windows-latest
        options:
          - windows-latest
          - ubuntu-24.04
          - macos-15-intel
          - macos-latest
permissions:
  contents: read
concurrency:
  group: package-${{ github.ref }}-${{ inputs.platform }}
  cancel-in-progress: false
jobs:
  package:
    runs-on: ${{ inputs.platform }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev libdbus-1-dev libfuse2
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Windows package
        if: runner.os == 'Windows'
        run: npm run package:windows
      - name: Linux packages
        if: runner.os == 'Linux'
        run: npm run package:linux
      - name: macOS packages
        if: runner.os == 'macOS'
        run: npm run package:macos
      - name: Save installation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: encore-${{ inputs.platform }}-unsigned-packages
          retention-days: 14
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/macos/*.app
            apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
