name: Installation packages
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Build platform (artifacts only; no publication)
        type: choice
        required: true
        default: windows-latest
        options:
          - windows-latest
          - ubuntu-24.04
          - macos-15-intel
          - macos-latest
      deb_only:
        description: Build only the Linux DEB for local testing
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: package-${{ github.ref }}-${{ inputs.platform }}
  cancel-in-progress: false
jobs:
  package:
    runs-on: ${{ inputs.platform }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          cache-on-failure: true
      - name: Linux dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 8
        run: sh ../../scripts/install-linux-deps.sh package
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Windows package
        if: runner.os == 'Windows'
        run: npm run package:windows
      - name: Linux packages
        if: runner.os == 'Linux' && !inputs.deb_only
        run: npm run package:linux -- --features linux-embed-referrer
      - name: Linux DEB
        if: runner.os == 'Linux' && inputs.deb_only
        run: npx tauri build --config src-tauri/tauri.bundle.conf.json --features linux-embed-referrer --bundles deb
      - name: Inspect Linux DEB
        if: runner.os == 'Linux'
        run: |
          for package in src-tauri/target/release/bundle/deb/*.deb; do
            dpkg-deb --info "$package"
            dpkg-deb --contents "$package"
            sha256sum "$package"
          done
      - name: macOS packages
        if: runner.os == 'macOS'
        run: npm run package:macos
      - name: Save installation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ycoremusic-${{ inputs.platform }}-unsigned-packages
          retention-days: 14
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/macos/*.app
            apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
