name: Desktop checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux webview dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npx playwright install chromium --with-deps
      - run: npm run test:ui
      - run: npm run build
      - name: Native build (no installer)
        run: npx tauri build --debug --no-bundle
      - uses: actions/upload-artifact@v4
        with:
          name: encore-${{ matrix.os }}-debug
          path: |
            apps/desktop/src-tauri/target/debug/encore.exe
            apps/desktop/src-tauri/target/debug/encore
          if-no-files-found: error

