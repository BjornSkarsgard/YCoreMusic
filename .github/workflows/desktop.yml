name: Desktop checks
on: [push, pull_request, workflow_dispatch]
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, macos-15-intel, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          cache-on-failure: true
      - name: Linux webview dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev libdbus-1-dev
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npx playwright install chromium --with-deps
      - run: npm run test:ui
      - run: npm run build
      - name: Yandex probe tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --features yandex-probe
      - name: Yandex probe executable
        run: cargo build --manifest-path src-tauri/Cargo.toml --features yandex-probe --bin yandex-probe
      - name: Native build (no installer)
        run: npx tauri build --debug --no-bundle
      - uses: actions/upload-artifact@v4
        with:
          name: ycoremusic-${{ matrix.os }}-debug
          path: |
            apps/desktop/src-tauri/target/debug/yandex-probe.exe
            apps/desktop/src-tauri/target/debug/yandex-probe
            apps/desktop/src-tauri/target/debug/YCoreMusic.exe
            apps/desktop/src-tauri/target/debug/YCoreMusic
          if-no-files-found: error
